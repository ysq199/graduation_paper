# ============================================================
# YOLO11n-seg + P2 小目标分割分支
# 改动说明：在原始 YOLO11-seg 的基础上增加 P2/4 检测层
# P2 特征图分辨率是输入的 1/4，能检测更小的缺陷（4x4像素起）
# ============================================================

nc: 80
scales:
  n: [0.50, 0.25, 1024]   # 2876848 → P2 版约 +0.3M 参数
  s: [0.50, 0.50, 1024]   # 10113248 → P2 版约 +1M 参数

# ============ Backbone（同原始 YOLO11） ============
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]          # 1-P2/4  ← 原始 P2 特征（作为新增分支的输入）
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2
  - [-1, 1, Conv, [256, 3, 2]]          # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]   # 4
  - [-1, 1, Conv, [512, 3, 2]]          # 5-P4/16
  - [-1, 2, C3k2, [512, True]]          # 6
  - [-1, 1, Conv, [1024, 3, 2]]         # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]         # 8
  - [-1, 1, SPPF, [1024, 5]]            # 9
  - [-1, 2, C2PSA, [1024]]              # 10

# ============ Head（新增 P2 输出层） ============
head:
  # --- P5 → P4 上采样 ---
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 11
  - [[-1, 6], 1, Concat, [1]]                        # 12 cat backbone P4
  - [-1, 2, C3k2, [512, False]]                      # 13

  # --- P4 → P3 上采样 ---
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 14
  - [[-1, 4], 1, Concat, [1]]                        # 15 cat backbone P3
  - [-1, 2, C3k2, [256, False]]                      # 16

  # ★★★ 新增：P3 → P2 上采样 ★★★
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 17
  - [[-1, 2], 1, Concat, [1]]                        # 18 cat backbone P2
  - [-1, 2, C3k2, [128, False]]                      # 19 (P2/4-small) ← 新增的小目标检测层

  # --- P2 → P3 下采样 ---
  - [-1, 1, Conv, [128, 3, 2]]                      # 20 ← 下采样回 P3
  - [[-1, 16], 1, Concat, [1]]                       # 21 cat head P3
  - [-1, 2, C3k2, [256, False]]                      # 22 (P3/8)

  # --- P3 → P4 下采样 ---
  - [-1, 1, Conv, [256, 3, 2]]                      # 23
  - [[-1, 13], 1, Concat, [1]]                       # 24 cat head P4
  - [-1, 2, C3k2, [512, False]]                      # 25 (P4/16)

  # --- P4 → P5 下采样 ---
  - [-1, 1, Conv, [512, 3, 2]]                      # 26
  - [[-1, 10], 1, Concat, [1]]                       # 27 cat head P5
  - [-1, 2, C3k2, [1024, True]]                      # 28 (P5/32)

  # ★★★ 四个检测头：P2, P3, P4, P5 ★★★
  - [[19, 22, 25, 28], 1, Segment, [nc, 32, 256]]
